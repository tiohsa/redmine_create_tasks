services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 20

  redmine:
    image: redmine:5.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine
      REDMINE_SECRET_KEY_BASE: redmine-create-tasks-ci-secret
      REDMINE_LANG: en
    ports:
      - "3000:3000"
    volumes:
      - ../..:/usr/src/redmine/plugins/redmine_create_tasks
